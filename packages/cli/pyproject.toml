[project]
name = "auralake-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "auralake-shared",
    "httpx>=0.28.1",
    "typer>=0.21.1",
]

[project.optional-dependencies]
db = ["auralake-backend"]

[project.scripts]
auralake = "auralake_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auralake_cli"]

[tool.uv.sources]
auralake-shared = { workspace = true }
auralake-backend = { workspace = true }
