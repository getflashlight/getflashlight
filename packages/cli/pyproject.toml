[project]
name = "auralake-cli"
version = "0.2.0"
description = "Thin CLI for the Auralake FOCUS TCO platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
auralake = "auralake_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auralake_cli"]

[dependency-groups]
dev = ["ruff>=0.5"]
