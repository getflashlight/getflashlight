[project]
name = "auralake-backend"
version = "0.2.0"
description = "FOCUS-based multi-cloud TCO spend-visualization platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "databricks-sdk>=0.85.0",
    "duckdb>=1.2.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "mcp>=1.2",
    "psycopg[binary]>=3.1",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "structlog>=24.1",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
auralake-server = "auralake.server.main:run"
auralake-mcp = "auralake.mcp.server:run"
auralake-ingest = "auralake.ingest.runner:run"
auralake-transform = "auralake.transform.runner:run"
auralake-db-migrate = "auralake.store.migrate:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auralake"]

[dependency-groups]
dev = [
    "mypy>=1.9",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
