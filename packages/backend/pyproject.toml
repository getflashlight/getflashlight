[project]
name = "auralake-backend"
version = "0.2.0"
description = "FOCUS-based multi-cloud TCO spend-visualization platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "boto3>=1.43.35",
    "databricks-sdk>=0.118.0",
    "duckdb>=1.5.4",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "mcp>=1.28.0",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.38",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
auralake-server = "auralake.server.main:run"
auralake-mcp = "auralake.mcp.server:run"
auralake-ingest = "auralake.ingest.runner:run"
auralake-transform = "auralake.transform.runner:run"
auralake-db-migrate = "auralake.store.migrate:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auralake"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
