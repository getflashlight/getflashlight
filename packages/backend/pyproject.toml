[project]
name = "auralake-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "auralake-shared",
    "alembic>=1.18.3",
    "boto3>=1.42.45",
    "databricks-sdk>=0.85.0",
    "duckdb>=1.2.0",
    "fastapi>=0.128.6",
    "gitpython>=3.1.46",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.2",
    "pygithub>=2.8.1",
    "ruamel-yaml>=0.19.1",
    "sqlmodel>=0.0.32",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
auralake-server = "auralake_backend.server.main:run"
auralake-db-migrate = "auralake_backend.db.migrate:run"
auralake-generate-key = "auralake_backend.db.generate_key:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auralake_backend"]

[tool.uv.sources]
auralake-shared = { workspace = true }
