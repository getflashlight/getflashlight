# For the dev Alembic CLI only (e.g. `alembic revision -m ...`).
# Runtime migrations are applied via `auralake-db-migrate`, which builds its
# config in code (see auralake.store.migrate) and does not read this file.

[alembic]
script_location = src/auralake/migrations
prepend_sys_path = src
version_path_separator = os
