name: Release

# CD: on a version tag, run the gate, build the wheel + sdist, publish them to
# a GitHub Release, and publish to PyPI (trusted publishing, no token).
# Tag and pyproject version must match.
#
#   git tag v0.2.2 && git push origin v0.2.2
#
# To dry-run the build/publish pipeline against TestPyPI without cutting a
# real release, trigger manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create the release + upload assets
  id-token: write  # OIDC for PyPI/TestPyPI trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Check tag matches pyproject version
        if: github.event_name == 'push'
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$VERSION tag=$TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match pyproject version '$VERSION'"
            exit 1
          fi

      - name: Gate (lint, type-check, test)
        run: |
          uv run ruff check src tests
          uv run mypy src tests
          uv run pytest

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
