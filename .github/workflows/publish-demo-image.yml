name: publish-demo-image

on:
  push:
    branches: [main]
    paths: [Dockerfile, demo/lake/**, docs/**, mkdocs.yml, src/**, pyproject.toml, uv.lock]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-demo-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ychaparala/getflashlight-demo:latest
            ghcr.io/ychaparala/getflashlight-demo:${{ github.sha }}
