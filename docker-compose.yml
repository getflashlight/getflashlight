# Auralake — batteries-included FOCUS TCO stack.
#   db → migrate → (server, mcp) → grafana
# Ingest is on-demand (see the `ingest` profile / README), not a daemon.

x-backend-env: &backend-env
  AURALAKE_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-auralake}:${POSTGRES_PASSWORD:-auralake}@db:5432/${POSTGRES_DB:-auralake}"
  # The dedicated `migrate` service applies migrations; server need not re-run them.
  AURALAKE_AUTO_MIGRATE: "false"
  AURALAKE_API_KEY: "${AURALAKE_API_KEY:-}"
  AURALAKE_CONNECTIONS_PATH: "/config/connections.yml"
  DATABRICKS_TOKEN: "${DATABRICKS_TOKEN:-}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auralake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auralake}
      POSTGRES_DB: ${POSTGRES_DB:-auralake}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auralake}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment: *backend-env
    command: ["auralake-db-migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment: *backend-env
    command: ["auralake-server"]
    ports:
      - "8001:8000"
    volumes:
      - ./config:/config:ro
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  mcp:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment: *backend-env
    command: ["auralake-mcp"]
    ports:
      - "8002:8002"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # On-demand ingest: `docker compose --profile ingest run --rm ingest`
  ingest:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment: *backend-env
    command: ["auralake-ingest"]
    volumes:
      - ./config:/config:ro
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["ingest"]

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      AURALAKE_DB_USER: "${POSTGRES_USER:-auralake}"
      AURALAKE_DB_PASSWORD: "${POSTGRES_PASSWORD:-auralake}"
      AURALAKE_DB_NAME: "${POSTGRES_DB:-auralake}"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - db

volumes:
  pgdata:
