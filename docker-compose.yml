services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auralake
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auralake
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auralake"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AURALAKE_DATABASE_URL: "postgresql://auralake:password@db:5432/auralake"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: apps/ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8000"
    depends_on: [backend]
    profiles: [ui]

volumes:
  pgdata:
