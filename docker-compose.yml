services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      AURALAKE_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["uv", "run", "--project", "packages/backend", "auralake-db-migrate"]

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "8001:8000"
    environment:
      AURALAKE_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      AURALAKE_ENCRYPTION_KEY: ${AURALAKE_ENCRYPTION_KEY}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
      DATABRICKS_HOST: ${DATABRICKS_HOST}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./packages/dashboard
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      AURALAKE_API_URL: "http://backend:8000"
      AURALAKE_API_KEY: ${AURALAKE_API_KEY:-}
    depends_on:
      - backend


volumes:
  pgdata:
