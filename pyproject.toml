# Virtual uv-workspace root (no [project] table → not itself a package).
# Members are the deployable packages under packages/*.

[tool.uv.workspace]
members = ["packages/backend", "packages/cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
