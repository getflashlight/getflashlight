[project]
name = "getflashlight"
version = "0.2.0"
description = "FOCUS-based multi-cloud spend-visualization platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Yuga Chaparala", email = "ychaparala@gmail.com" },
    { name = "Velu Natarajan", email = "velunatsf@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    # Connector SDKs are imported eagerly by ingest, so they're required for now.
    # Making them optional extras needs lazy connector imports (follow-up).
    "boto3>=1.43.67",
    "databricks-sdk>=0.125.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=2.0.0",
    "nicegui>=3.15.0",
    "pandas>=3.0.5",
    "platformdirs>=4.11.0",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0,<26",
    "pydantic>=2.13.4",
    "pydantic-ai-slim[anthropic,google,openai]>=2.26.0",
    "pydantic-graph>=2.22.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "snowflake-connector-python>=3.12.0",
    "structlog>=26.1.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
# Only needed for RedshiftConfig.bastion_host/db_password_env (a direct SQL
# connection, tunneled or not, for clusters not reachable via the Data API) —
# lazily imported so the default `pip install getflashlight` doesn't pull these
# in for everyone.
redshift-bastion = [
    "sshtunnel>=0.4.0",
    "redshift-connector>=2.1.16",
]

[project.scripts]
flashlight = "flashlight.cli:app"
fl = "flashlight.cli:app"

[project.urls]
Homepage = "https://getflashlight.app/"
Repository = "https://github.com/getflashlight/getflashlight"
Issues = "https://github.com/getflashlight/getflashlight/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flashlight"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocs-llmstxt>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
