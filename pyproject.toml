[project]
name = "auralake"
version = "0.2.0"
description = "FOCUS-based multi-cloud TCO spend-visualization platform"
requires-python = ">=3.11"
dependencies = [
    # Connector SDKs are imported eagerly by ingest, so they're required for now.
    # Making them optional extras needs lazy connector imports (follow-up).
    "boto3>=1.43.36",
    "databricks-sdk>=0.119.0",
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "mcp>=1.28.0",
    "pandas>=3.0.3",
    "platformdirs>=4.10.0",
    "plotly>=6.8.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.3",
    "streamlit>=1.58.0",
    "structlog>=26.1.0",
    "typer>=0.26.7",
]

[project.scripts]
auralake = "auralake.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auralake"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

# numpy's bundled stubs use 3.12+ `type` statements that break parsing under our
# 3.11 target; don't follow them (pandas re-exports numpy, so this covers it too).
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
