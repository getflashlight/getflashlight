bundle:
  name: production-bundle

targets:
  production:
    default: true
    workspace:
      host: https://dbc-xxx.cloud.databricks.com
  staging:
    workspace:
      host: https://dbc-yyy.cloud.databricks.com

resources:
  jobs:
    reporting_daily:
      name: "Daily Reporting"
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
      tasks:
        - task_key: report
          existing_cluster_id: "${resources.clusters.analytics.id}"
          notebook_task:
            notebook_path: /Repos/reporting/daily

  clusters:
    analytics:
      cluster_name: "Analytics Cluster"
      num_workers: 2
      node_type_id: m5.xlarge
      autoscale:
        min_workers: 1
        max_workers: 4
