site_name: Flashlight
site_description: FOCUS-based, multi-cloud spend visualization. Finds what's burning money in the dark.
site_url: https://getflashlight.app/
repo_url: https://github.com/getflashlight/getflashlight
repo_name: getflashlight/getflashlight

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Inter
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      title: On this page

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid.js

plugins:
  - search
  - llmstxt:
      markdown_description: >
        FOCUS-based, multi-cloud spend visualization. Ingests cloud billing
        in the FinOps FOCUS format, standardizes it into a BRONZE/SILVER/GOLD
        Parquet lake, and serves a bundled dashboard plus an MCP server for
        agents. Installs with `pip install getflashlight` — no Docker, no
        database server.
      sections:
        Docs:
          - index.md: Overview — what Flashlight is and why the numbers are trustworthy
          - quickstart.md: Sample data to a running dashboard in two commands
          - architecture.md: The BRONZE → SILVER → GOLD lake and its invariants
          - connectors.md: AWS, Databricks, Redshift, and the mapping SQL
          - reference/cli.md: Every `flashlight` command
        Design:
          - design/efficiency-waste.md: The efficiency/waste GOLD group and its rules
          - design/ai-costs.md: AI/LLM spend, token attribution per project and user, and why a $/token figure is only honest for pay-per-token serving

nav:
  - Home: index.md
  - Get started:
      - Overview: getting-started/overview.md
      - Install Flashlight: getting-started/installation.md
      - Quickstart: quickstart.md
      - Connect a real source: getting-started/real-source.md
  - User guide:
      - Configure Flashlight: guides/configure.md
      - Ingest and manage data: guides/ingest.md
      - Explore the dashboard: guides/dashboard.md
      - Use Flashlight with agents: guides/mcp.md
  - Concepts:
      - Data architecture: architecture.md
      - FOCUS and cost integrity: concepts/focus-and-integrity.md
      - GOLD views and metrics: concepts/gold-views.md
      - Efficiency and recoverable spend: design/efficiency-waste.md
      - AI costs and usage: design/ai-costs.md
      - Backing storage: design/backing-storage.md
      - Backing compute: design/backing-compute.md
  - Connectors:
      - Overview and support matrix: connectors/overview.md
      - AWS: connectors/aws.md
      - Databricks: connectors/databricks.md
      - Amazon Redshift: connectors/redshift.md
      - Snowflake: connectors/snowflake.md
      - Mapping details: connectors.md
      - Build a connector: connectors/custom.md
  - Snowflake:
      - User guide: snowflake/user-guide.md
      - FOCUS mapping: snowflake/focus-mapping.md
      - Service types: snowflake/service-types.md
  - Reference:
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Data contracts: reference/data-contracts.md
      - MCP tools: reference/mcp-tools.md
  - Troubleshooting: troubleshooting/index.md
  - Development:
      - Contributing: development/contributing.md
      - Documentation guide: development/documentation.md
      - Capture dashboard screenshots: development/screenshots.md
      - Design decisions:
          - Efficiency / waste: design/efficiency-waste.md
          - AI costs: design/ai-costs.md
          - Backing storage: design/backing-storage.md
          - Backing compute: design/backing-compute.md

exclude_docs: |
  research/
